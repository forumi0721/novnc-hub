services:
  novnc-hub:
    build: .
    container_name: novnc-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/conf.d/novnc
    environment:
      - PORT=8080
      - CONFIG_PATH=/conf.d/novnc/config.json
      - SESSION_SECRET=novnc-custom-secret-change-me
