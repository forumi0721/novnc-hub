<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noVNC Console - 원격 데스크톱</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }
    #screen {
      width: 100%;
      height: calc(100vh - 50px);
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: auto;
    }
    /* noVNC 기본 캔버스 스타일 보정 */
    #screen > div {
      margin: auto;
    }
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-weight: 500;
    }
    .status-indicator.connected {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-indicator.connecting {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .status-indicator.disconnected {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body class="viewer-page">
  <!-- 상단 컨트롤 툴바 -->
  <div class="viewer-toolbar">
    <div class="toolbar-left">
      <a href="/" class="btn btn-secondary btn-sm" title="서버 목록으로 돌아가기">
        ← 목록
      </a>
      <select id="server-switch" class="server-select" title="서버 즉시 전환">
        <option value="">서버 선택...</option>
      </select>
      <div id="conn-status" class="status-indicator connecting">
        ● 연결 준비 중...
      </div>
    </div>

    <div class="toolbar-right">
      <button id="btn-cad" class="btn btn-secondary btn-sm" title="Ctrl+Alt+Del 키 조합 전송">
        Ctrl+Alt+Del
      </button>
      <button id="btn-scale" class="btn btn-secondary btn-sm" title="창 크기에 맞춤 토글">
        📐 창 맞춤: ON
      </button>
      <button id="btn-fullscreen" class="btn btn-secondary btn-sm" title="전체화면">
        ⛶ 전체화면
      </button>
      <button id="btn-reconnect" class="btn btn-primary btn-sm" title="재연결">
        🔄 재연결
      </button>
    </div>
  </div>

  <!-- 메인 VNC 캔버스 렌더링 영역 -->
  <div id="screen"></div>

  <!-- VNC 패스워드 입력 모달 (비밀번호 미설정/불일치 시 표시) -->
  <div id="modal-password" class="modal-overlay">
    <div class="modal-content" style="max-width: 380px;">
      <div class="modal-header">
        <h2>VNC 비밀번호 필요</h2>
      </div>
      <form id="form-password">
        <div class="modal-body">
          <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1rem;">
            이 VNC 서버에 접속하려면 패스워드가 필요합니다.
          </p>
          <div class="form-group">
            <input type="password" id="input-vnc-pw" required placeholder="VNC 비밀번호" autofocus>
          </div>
        </div>
        <div class="modal-footer">
          <a href="/" class="btn btn-secondary">취소</a>
          <button type="submit" class="btn btn-primary">연결</button>
        </div>
      </form>
    </div>
  </div>

  <!-- noVNC ES Module 구동 스크립트 -->
  <script type="module" src="/js/viewer.js"></script>
</body>
</html>
